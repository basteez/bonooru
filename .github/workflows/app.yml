# App CI (Stories 3.2, 4.1 and 4.4, AD-14, AD-18, AD-21): the Cargo
# workspace in app/ on the three desktop OS. Gates: rustfmt, cargo test (the
# shared conformance vectors and app core tests C.1 to C.25, the GUI tests
# G.1 to G.6 and G.10 to G.13, no GPU, no real serial port), clippy with
# -D warnings, the eframe/egui version pin, the Linux no-Wayland and
# accesskit feature checks (G.8), `ocb-sim` never in the shipped graph and
# serialport's libudev feature on (Story 4.4), the smoke run of the real
# window with the serial worker (G.7, `worker=`) and the cargo-deny licence
# and network-crate gate (G.9). The `probe-artifacts` job builds the
# dev-only `ocb-probe` bench tool in release mode for Windows x64, Linux x64
# and arm64 and macOS arm64 and uploads it, so the owner needs no toolchain
# on the bench machines (Story 4.4 AC 9).
# No path filter, like firmware.yml: the vectors are shared, so a firmware
# change must run the app job too.
name: app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  app:
    name: app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags for the git describe version (AD-14)

      # rustup reads app/rust-toolchain.toml; no `@stable` action, which would
      # ignore the pin.
      - name: Toolchain from rust-toolchain.toml (Rust 1.100.0)
        run: |
          rustup toolchain install
          rustc --version
          rustc --version | grep -q '^rustc 1\.100\.0 ' || { echo "::error::expected rustc 1.100.0"; exit 1; }

      # What eframe/wgpu/winit need to build and to run under Xvfb (X11
      # only, AD-18; lavapipe gives wgpu a software Vulkan adapter), and
      # libudev-dev for serialport's port enumeration (Story 4.4). No
      # Wayland or ALSA: ALSA returns with Story 5.11.
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libudev-dev libxkbcommon-dev libxkbcommon-x11-0 libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            xvfb mesa-vulkan-drivers libegl1 libgl1-mesa-dri

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app -> target

      - name: Format
        run: cargo fmt --all --check

      - name: Test (vectors, properties, purity, version, C.21-C.25, GUI G.1-G.6, G.10-G.13)
        run: cargo test --locked --workspace

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: eframe and egui pinned at 0.37.0 (AC 1)
        run: |
          cargo tree --locked -p ocb-app -i eframe --depth 0 | tee pins.txt
          cargo tree --locked -p ocb-app -i egui --depth 0 | tee -a pins.txt
          grep -qx 'eframe v0.37.0' pins.txt || { echo "::error::eframe is not v0.37.0"; exit 1; }
          grep -qx 'egui v0.37.0' pins.txt || { echo "::error::egui is not v0.37.0"; exit 1; }

      # G.8 (AD-18): eframe built without its wayland feature. (winit's own
      # wayland feature is on through accesskit_winit; the app forces X11 at
      # run time, checked by the smoke run below.)
      - name: No eframe wayland feature (G.8)
        if: runner.os == 'Linux'
        run: |
          cargo tree --locked -p ocb-app -e features -i eframe --target x86_64-unknown-linux-gnu | tee /tmp/eframe-features.txt
          if grep -q 'eframe feature "wayland"' /tmp/eframe-features.txt; then
            echo "::error::eframe is built with its wayland feature (AD-18)"
            exit 1
          fi

      # G.8 (Story 4.3 AC 15): eframe's accesskit feature enabled by ocb-app
      # in the normal (non-dev) graph for all three targets (the feature
      # graph is computed per --target, so one runner checks them all).
      # egui_kittest's dev feature turns it back on in test builds, so
      # cargo test cannot catch it missing.
      - name: eframe accesskit feature on (G.8, Story 4.2)
        if: runner.os == 'Linux'
        run: bash gui/ci/check-accesskit.sh x86_64-unknown-linux-gnu aarch64-apple-darwin x86_64-pc-windows-msvc

      # Story 4.4 AC 11: the fake backends of `ocb-sim` (feature `sim` of
      # ocb-services) are for tests and dry runs only. `cargo tree -i` exits
      # 0 with "nothing to print" when no path leads to the crate, so the
      # check looks for the crate's own line in the inverted tree.
      - name: ocb-sim never ships (Story 4.4)
        if: runner.os == 'Linux'
        run: |
          for pkg in ocb-app ocb-services ocb-probe; do
            cargo tree --locked -p "$pkg" -e normal --target all -i ocb-sim > sim-tree.txt 2>&1
            if grep -q '^ocb-sim v' sim-tree.txt; then
              cat sim-tree.txt
              echo "::error::ocb-sim is in $pkg's normal dependency graph"
              exit 1
            fi
            echo "ok: no ocb-sim in $pkg's normal graph"
          done

      # Story 4.4 AC 11 / E3-A5: serialport keeps its default libudev feature
      # in the shipped app's Linux graph (without it, Linux enumeration
      # reports no USB product string and may list ports that do not exist).
      - name: serialport libudev feature on (Story 4.4)
        if: runner.os == 'Linux'
        run: |
          cargo tree --locked -p ocb-app -e features -i serialport --target x86_64-unknown-linux-gnu | tee serialport-features.txt
          grep -q 'serialport feature "libudev"' serialport-features.txt || { echo "::error::serialport is built without its libudev feature"; exit 1; }

      - name: Build the app
        run: cargo build --locked -p ocb-app

      # G.7: the real window on each OS. On Linux under Xvfb with a bogus
      # WAYLAND_DISPLAY: the app must still open on X11 (AC 7). The exit
      # status is captured right after the command (no pipeline), and
      # gui/ci/check-smoke.sh checks every field of the line.
      - name: Smoke run (G.7)
        timeout-minutes: 5
        run: |
          case "$RUNNER_OS" in
            Linux) backend='(Xlib|Xcb)' ;;
            macOS) backend='AppKit' ;;
            Windows) backend='Win32' ;;
            *) echo "::error::unknown runner OS $RUNNER_OS"; exit 1 ;;
          esac
          : > smoke-all.txt
          for args in "--smoke-test" "--smoke-test --gallery"; do
            set +e
            if [ "$RUNNER_OS" = Linux ]; then
              WAYLAND_DISPLAY=ocb-no-such-socket xvfb-run -a target/debug/bonooru $args > smoke.txt 2> smoke-err.txt
            else
              target/debug/bonooru $args > smoke.txt 2> smoke-err.txt
            fi
            rc=$?
            set -e
            cat smoke.txt
            cat smoke-err.txt >&2
            [ "$rc" -eq 0 ] || { echo "::error::bonooru $args exited $rc"; exit 1; }
            bash gui/ci/check-smoke.sh smoke.txt "$backend"
            cat smoke.txt >> smoke-all.txt
          done

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.22.0

      - name: Licence and network-crate gate (NFR-07, AD-21)
        run: cargo deny --locked check licenses bans

      - name: Job summary
        run: |
          version="$(cargo test --locked -q --test version -- --nocapture 2>/dev/null | sed -n 's/^OCB_APP_VERSION=//p')"
          {
            echo "## App (${{ matrix.os }})"
            echo
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| App version | \`${version}\` |"
            echo "| rustc | \`$(rustc --version)\` |"
            if [ -f smoke-all.txt ]; then
              while IFS= read -r line; do
                echo "| Smoke | \`${line}\` |"
              done < smoke-all.txt
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Story 4.4 AC 9: the dev-only bench tool, built for the owner's machines
  # (no Rust toolchain needed there). Needs nothing from `app`: parallel.
  # Linux on ubuntu-22.04 (glibc 2.35), so the binary also runs on distros
  # older than a 24.04 build would allow. Never part of a release.
  probe-artifacts:
    name: probe artifact (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: ocb-probe-linux-x64
          - os: ubuntu-22.04-arm
            name: ocb-probe-linux-arm64
          - os: windows-latest
            name: ocb-probe-windows-x64
          - os: macos-latest
            name: ocb-probe-macos-arm64
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags for the git describe version (AD-14)

      - name: Toolchain from rust-toolchain.toml (Rust 1.100.0)
        run: |
          rustup toolchain install
          rustc --version
          rustc --version | grep -q '^rustc 1\.100\.0 ' || { echo "::error::expected rustc 1.100.0"; exit 1; }

      - name: Linux system dependencies (libudev for serialport)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libudev-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app -> target
          key: probe

      - name: Build ocb-probe (release)
        run: cargo build --locked --release -p ocb-probe

      - name: Run check (--help)
        run: target/release/ocb-probe --help

      # Only libudev.so.1, libc, libm, libgcc_s, the vDSO and the loader;
      # anything else or a "not found" fails (tools/ocb-probe/ci/check-ldd.sh).
      - name: Linked libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          ldd target/release/ocb-probe | tee ldd.txt
          {
            echo "## ${{ matrix.name }}: linked libraries"
            echo
            echo '```'
            cat ldd.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          bash tools/ocb-probe/ci/check-ldd.sh ldd.txt

      # tar keeps the exec bit, which upload-artifact's zip drops.
      - name: Package
        run: |
          mkdir -p dist
          if [ "$RUNNER_OS" = Windows ]; then
            cp target/release/ocb-probe.exe dist/
          else
            tar czf "dist/${{ matrix.name }}.tar.gz" -C target/release ocb-probe
          fi
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: app/dist/*
          if-no-files-found: error
          retention-days: 14
