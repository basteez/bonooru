# Firmware CI (Story 2.1): pinned toolchain (AD-1), both UF2s, host tests,
# pin grep (AD-20). Reusable through workflow_call so the later app/release
# workflow downloads the `firmware-uf2` artifact instead of rebuilding.
name: firmware

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # Standalone runs (push, pull_request, dispatch) share one group per ref and
  # cancel each other. Under workflow_call, github.workflow is the caller's name,
  # so a called run gets its own group (the caller's run_id): a standalone push
  # run on the same ref can then never cancel the caller's `needs:` job.
  group: firmware-${{ github.workflow == 'firmware' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  firmware:
    name: firmware (build + host tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags are needed for the git describe version (AD-14)
          submodules: false

      - name: Init pico-sdk and only its lib/tinyusb (AD-1)
        run: |
          git submodule update --init --depth 1 firmware/external/pico-sdk
          git -C firmware/external/pico-sdk submodule update --init --depth 1 lib/tinyusb

      - name: Check submodule pins
        run: |
          set -a; . firmware/tools/toolchain.env; set +a
          sdk="$(git -C firmware/external/pico-sdk rev-parse HEAD)"
          tusb="$(git -C firmware/external/pico-sdk/lib/tinyusb rev-parse HEAD)"
          echo "pico-sdk HEAD: ${sdk} (pinned ${PICO_SDK_COMMIT}, tag ${PICO_SDK_TAG})"
          echo "TinyUSB HEAD:  ${tusb} (pinned ${TINYUSB_COMMIT}, ${TINYUSB_VERSION})"
          [ "${sdk}" = "${PICO_SDK_COMMIT}" ] || { echo "::error::pico-sdk is not at tag ${PICO_SDK_TAG}"; exit 1; }
          [ "${tusb}" = "${TINYUSB_COMMIT}" ] || { echo "::error::TinyUSB is not at ${TINYUSB_VERSION}"; exit 1; }
          # Initialised nested submodules have no leading '-' in `git submodule status`.
          others="$(git -C firmware/external/pico-sdk submodule status | grep -v '^-' | grep -v ' lib/tinyusb' || true)"
          if [ -n "${others}" ]; then
            echo "::error::only lib/tinyusb may be initialised, found: ${others}"
            exit 1
          fi

      - name: CMake version (needs >= 3.25)
        run: |
          cmake --version
          ninja --version

      - name: Cache pinned tools
        uses: actions/cache@v6
        with:
          path: firmware/.tools
          key: fw-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('firmware/tools/toolchain.env', 'firmware/tools/install-tools.sh') }}

      - name: Install pinned tools (verifies SHA256, skips when cached)
        run: |
          firmware/tools/install-tools.sh
          set -a; . firmware/tools/toolchain.env; set +a
          echo "OCB_ARM_TOOLCHAIN=${GITHUB_WORKSPACE}/firmware/.tools/arm-gnu-toolchain-${ARM_TOOLCHAIN_VERSION}" >> "$GITHUB_ENV"
          echo "OCB_PICOTOOL_DIR=${GITHUB_WORKSPACE}/firmware/.tools/picotool-${PICOTOOL_VERSION}" >> "$GITHUB_ENV"

      # The prebuilt Linux picotool links libusb-1.0.so.0 dynamically (checked
      # with readelf in Story 2.1). Install the runtime library only if the
      # runner image lacks it; picotool is never built from source.
      - name: picotool runtime dependency (libusb-1.0)
        run: |
          if ldconfig -p | grep -q 'libusb-1.0.so.0'; then
            echo "libusb-1.0.so.0 present on the runner image"
          else
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends libusb-1.0-0
          fi

      - name: Tool versions
        run: |
          "${OCB_ARM_TOOLCHAIN}/bin/arm-none-eabi-gcc" --version
          "${OCB_PICOTOOL_DIR}/picotool/picotool" version

      - name: Build fw-release
        working-directory: firmware
        run: |
          cmake --preset fw-release
          cmake --build --preset fw-release

      - name: Build fw-debug (compile gate for the debug-only pin)
        working-directory: firmware
        run: |
          cmake --preset fw-debug
          cmake --build --preset fw-debug

      # Story 2.5 D9: the bench flavours (one UF2 per hardware check) and the
      # XIP variant of the RAM gate's self-test (D2); compile only, 0 warnings
      # (our sources build with -Werror).
      - name: Build the Story 2.5 flavours (debug -O3, timeline, hang core 0, hang core 1, XIP)
        working-directory: firmware
        run: |
          set -o pipefail
          for p in fw-debug-o3 fw-debug-timeline fw-debug-hang0 fw-debug-hang1 fw-release-xip; do
            cmake --preset "$p"
            cmake --build --preset "$p" 2>&1 | tee "${RUNNER_TEMP}/build-$p.log"
            if grep -qi 'warning' "${RUNNER_TEMP}/build-$p.log"; then
              echo "::error::$p built with warnings"
              exit 1
            fi
          done

      - name: Host tests
        working-directory: firmware
        run: |
          cmake --preset host-tests
          cmake --build --preset host-tests
          ctest --preset host-tests

      - name: Pin grep (AD-20)
        run: firmware/tools/check-pins.sh

      - name: Proto version vs vectors (AD-14)
        run: firmware/tools/check-proto-version.sh

      - name: Proto library is pico-sdk free (AD-2)
        run: firmware/tools/check-proto-pure.sh

      - name: Controller core is pico-sdk free (AD-2)
        run: firmware/tools/check-core-pure.sh

      - name: Controller link is pico-sdk free (AD-2)
        run: firmware/tools/check-link-pure.sh

      - name: Controller P2 profile is pico-sdk and TinyUSB free (AD-2)
        run: firmware/tools/check-p2-pure.sh

      - name: Bridge core is pico-sdk and TinyUSB free (AD-2, Story 3.1)
        run: firmware/tools/check-bridge-pure.sh

      # Story 2.3 AC5a: the P2 debug log exists in debug builds only. The
      # debug ELF must contain it, so a rename cannot make the gate vacuous.
      # Story 2.5 Task 8.3: nor the test melody or the hang injectors; the
      # flavours that must carry them prove each family is found.
      - name: Release has no debug log, test melody or hang injector (AC5a, story 2.5)
        run: |
          firmware/tools/check-release-nolog.sh firmware/build/fw-release/controller/controller.elf
          firmware/tools/check-release-nolog.sh firmware/build/fw-release-xip/controller/controller.elf
          firmware/tools/check-release-nolog.sh --expect-present firmware/build/fw-debug/controller/controller.elf
          firmware/tools/check-release-nolog.sh --expect-present firmware/build/fw-debug-o3/controller/controller.elf
          firmware/tools/check-release-nolog.sh --expect-present=dbglog,testtl firmware/build/fw-debug-timeline/controller/controller.elf
          firmware/tools/check-release-nolog.sh --expect-present=dbglog,testtl,hang firmware/build/fw-debug-hang0/controller/controller.elf
          firmware/tools/check-release-nolog.sh --expect-present=dbglog,testtl,hang firmware/build/fw-debug-hang1/controller/controller.elf

      # Story 2.5 D5, D24: the published-state handoff carries `dmb sy` in
      # every controller ELF; the self-test fails without the definition.
      - name: Cross-core barrier is a real DMB (story 2.5 D5)
        run: |
          firmware/tools/check-barrier.sh --self-test
          for p in fw-release fw-debug fw-debug-o3 fw-debug-timeline fw-debug-hang0 fw-debug-hang1 fw-release-xip; do
            firmware/tools/check-barrier.sh "firmware/build/$p/controller/controller.elf"
          done

      # Story 2.5 D2: the hot path is in RAM (copy_to_ram); the XIP variant
      # proves the gate can tell the two apart.
      - name: Controller hot path runs from RAM (story 2.5 D2)
        run: |
          for p in fw-release fw-debug fw-debug-o3 fw-debug-timeline fw-debug-hang0 fw-debug-hang1; do
            firmware/tools/check-ram-hot-path.sh "firmware/build/$p/controller/controller.elf"
          done
          firmware/tools/check-ram-hot-path.sh --expect-flash firmware/build/fw-release-xip/controller/controller.elf

      # Story 2.5 D15 (issue #21): the static core 1 chain stays <= 1536 bytes.
      - name: Core 1 stack, static bound (story 2.5 D15)
        run: |
          for p in fw-release fw-debug fw-debug-o3 fw-debug-timeline; do
            firmware/tools/check-stack.sh "firmware/build/$p"
          done

      - name: Job summary
        run: |
          version="$(sed -n 's/^#define OCB_VERSION_STRING "\(.*\)"$/\1/p' firmware/build/fw-release/generated/ocb_version/ocb_version.h)"
          {
            echo "## Firmware build"
            echo
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Firmware version | \`${version}\` |"
            echo "| pico-sdk | \`$(git -C firmware/external/pico-sdk rev-parse HEAD)\` |"
            echo "| TinyUSB | \`$(git -C firmware/external/pico-sdk/lib/tinyusb rev-parse HEAD)\` |"
            echo "| Toolchain | \`$("${OCB_ARM_TOOLCHAIN}/bin/arm-none-eabi-gcc" --version | head -n 1)\` |"
            echo "| picotool | \`$("${OCB_PICOTOOL_DIR}/picotool/picotool" version | head -n 1)\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: firmware-uf2
          path: |
            firmware/build/fw-release/bridge/bridge.uf2
            firmware/build/fw-release/controller/controller.uf2
          if-no-files-found: error
          retention-days: 14
