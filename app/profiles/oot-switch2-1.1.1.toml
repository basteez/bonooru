# Ocarina Bot: bundled default mapping profile (AD-17), Story 1.5.
#
# Game: The Legend of Zelda: Ocarina of Time (Switch 2), game version 1.1.1 ONLY.
# Tested environment: Switch 2 system 23.5.0, OoT 1.1.1 (docs/test-plan.md, "Test environment";
# Story 1.4 field trials, "Environment and capture"). Other game versions need their own profile.
# Read-only default: a user copy with the same `name` and `game_version` overrides it (AD-17).
# Loading, validation and migration belong to Story 5.1 (ocb-core `profile` module); this file is data.
#
# Pitches are MIDI numbers of the SOUNDING pitch: the game sounds one octave above the community chart
# (A = 81 = A5, chart name A4). docs/ocarina-input-mechanics.md, "Note buttons".
#
# Tags used in the comments (every measured or tunable value carries one; labels such as schema and name do not):
#   MEASURED        value measured on the console; the comment names the test plan row / U-item.
#   MARGIN          measured limit plus a safety margin: "measured X, profile Y, margin Z".
#   OWNER CHOICE    value chosen by the owner; it is NOT a measured limit.
#   ESTIMATE        based on a rough observation (no tool, no error bar); to be confirmed. (No value uses it
#                   since Story 1.6; kept for future values.)
#   DESIGN DEFAULT  not measured at all; a starting value for the design, to be tuned later.
#
# Caveats:
# - Timing analysis: the analyser definitions behind the 1-frame U7 counts, U2 at 2 to 3 frames and the
#   jitter sigma were revised after seeing the Story 1.4 recordings (docs/test-plan.md, Story 1.4,
#   "Lessons"). Confirm on fresh recordings in Epic 7; Story 7.4 updates the timing margins from data.
# - Onset jitter (test plan row 2.4: IOI error sigma 0.48 to 0.70 frame through 2wiCC) is not a profile
#   key; it is the basis for the Epic 2 / Epic 7 timing targets.
# - Allow-listed inputs only (AD-9): L, R, A, Y, X, D-pad up/down, left stick. No ZL (opens the song
#   menu, U11), no ZR, no right stick.

schema = 1  # integer schema version (AD-17); Story 5.1 owns the schema and bumps it on shape changes

[profile]
name = "OoT Switch 2"  # label, not data; with game_version, the identity a user copy overrides (AD-17)
game_version = "1.1.1"  # MEASURED environment: OoT 1.1.1 on Switch 2 system 23.5.0 (test plan, "Test environment")
# MEASURED: frame period 16.67 ms (60 Hz) when the picture changes, 240 fps video (test plan row 2.5, U10).
# Caveat: 60 distinct images every second is not shown (the scene did not move continuously); the per-note
# latency clusters one frame apart (row 2.4) are consistent with input sampled at 60 Hz, not a proof of it.
frame_rate = 60

[buttons]  # MEASURED: natural sounding pitches (MIDI), test plan rows 1.1 and 1.9; mechanics doc "Note buttons"
L = 74  # D5, measured 596.6 Hz (row 1.9)
R = 77  # F5, measured 702.6 Hz (row 1.9)
A = 81  # A5, measured 894.3 Hz (row 1.9); the game sounds about +27 c sharp of A4 = 440 Hz
Y = 83  # B5, measured 1003.7 Hz (row 1.9)
X = 86  # D6, measured 1190.1 Hz (row 1.9)

[modifiers]  # MEASURED: semitone offsets, test plan rows 1.2 and 1.9; mechanics doc "Pitch modifiers"
dpad_up = 1  # MEASURED +1 semitone (rows 1.2, 1.9). On X it shifts about +115 c, not 100 c (row 1.9), still the right note
dpad_down = -1  # MEASURED -1 semitone (rows 1.2, 1.9). On X it shifts about -115 c (row 1.9), still the right note
stick_up = 2  # MEASURED +2 semitones only at full travel, stick_up_ly below (rows 1.6, 1.9; U6)
stick_down = -2  # MEASURED -2 semitones only at full travel, stick_down_ly below (rows 1.6, 1.9; U6)
# Stick values are canonical state bytes (AD-10: ly 0x00 = up, centre 0x80). The stick is a graded bend,
# not a switch (test plan row 1.6, U6): only full travel gives the full +-2 (50 % about +-105 c, 75 % about
# +-160 c); up and down are mirrored within a few cents. The bend still glides at the note start (Y + stick
# up: first 30 ms about -29 c, row 2.3), which is why stick modifiers keep the modifier lead below.
stick_up_ly = 0x00  # MEASURED: full travel up, wire Y 0xE00, A5 -> 1002 Hz, +199 c (row 1.6, U6)
stick_down_ly = 0xFF  # MEASURED: full travel down, wire Y 0x20C, A5 -> 797 Hz, -197 c (row 1.6, U6)
stick_lx = 0x80  # MEASURED: X centred; any X component reduces the bend (diagonals and corners about +-142 c, row 1.6)

[range]  # MEASURED: sounding range B4-F6, chromatic, all 19 pitches verified (test plan rows 1.2 and 1.9)
low = 71  # B4 (L + D-down + stick down, measured 499.9 Hz, row 1.9)
high = 89  # F6 (X + D-up + stick up, measured 1428.2 Hz, row 1.9)

# Timing. *_frames are integer frames at frame_rate (16.67 ms each; the pipeline snaps to this grid),
# *_ms are milliseconds (not on the frame grid). Measured values: test plan "Story 1.4 field trials" >
# "Values for Story 1.5" (rows 2.1 to 2.3). AD-15: min press and min gap must not fall below
# 2 x max(report_period_us, frame time); the frame-time part is 2 frames, the report period is measured in
# Epic 2 and Story 5.1 enforces the full rule.
[timing]
# MARGIN: measured 2 frames (33.3 ms), profile 3 frames (50 ms), margin +1 frame (test plan row 2.1, U7).
# 2 frames sounded 20/20 on A, L, R, X, Y; 1 frame only 16 to 18/20. 3 frames and longer were run on A only
# (20/20 each); 3 frames on L, R, X, Y was not run, the margin assumes longer presses do not sound worse.
min_press_frames = 3
# OWNER CHOICE: 5 frames (83.3 ms), NOT a measured limit (test plan row 2.2, U2). Measured 20/20 at
# 4 frames on A, L, Y; R 5 frames 19/20 pooled (20/20 with its own file's threshold); X unresolved (mic
# level, best 4 frames 18/20); R and X not run above 5 frames. No margin added on top: 5 is already 1 frame
# above the A, L, Y limit, and "retrigger" is a threshold on a continuous dip (definition-dependent).
min_gap_same_button_frames = 5
# MARGIN: measured 0 frames, profile 1 frame (16.7 ms), margin +1 frame (test plan row 2.3, U5). Lead 0 gave
# no wrong pitch longer than about 35 ms (2 frames) for D-up, D-down, stick up, stick down: 20/20 at every
# lead 0 to 5 on A; at lead 0 on L, R, X, Y 20/20 except X + stick down 19/20 and Y + stick up 19/20.
# A 1 to 2 frame lateness is not resolvable by audio, so Story 1.4 asks for at least 1 frame. One value for
# all four modifiers: all measured 0, no per-type split.
modifier_lead_frames = 1
# MARGIN: measured 6500 ms, profile 6000 ms, margin 500 ms (test plan row 1.10, U1; Story 1.6, 2026-11-21).
# Button A only, microphone onset/offset, 5 tries per hold: 4, 5, 5.5, 6 and 6.5 s held to the release 5/5
# each (D_ok = 6500 ms); 7 s auto-stopped 3/5 at 6599 to 6832 ms, the 10 s control 5/5 at 6810 to 7157 ms
# (T_stop = 6599 ms). Rule (Story 1.6 owner decision 1): floor100(min(D_ok, T_stop) - 500 ms) = 6000.
# L, R, Y, X were NOT measured: assumed equal to A by owner decision (Story 1.6 decision 7). Not covered:
# other buttons, held modifiers, the wavering (not reported as numbers). Notes longer than this are re-pressed
# after min_gap_same_button_frames (FR-05a).
max_sustain_ms = 6000
# DESIGN DEFAULT (not measured): lead before the first event of a timeline (START lead_us, AD-15; Stories
# 2.5 / 6.x), carried over from the placeholder in docs/score-format-and-mapping.md. The countdown the user
# sees is separate.
start_lead_ms = 500

# Fingering cost weights (fingering step, docs/score-format-and-mapping.md "Fingering cost (first idea)").
# DESIGN DEFAULT (not measured), all of them. "No modifier change" costs 0 and has no key.
# What the data supports: only the order no change < D-pad change < stick change. The D-pad steps at once,
# the stick glides (U4, test plan row 1.5) and a stick note's first 30 ms read about -29 c (row 2.3).
# What it does not support: the numbers themselves; no test compares two fingerings of the same note for
# audible quality. Possible later refinement, not encoded here: on X the D-pad shifts about +-115 c, so two
# X fingerings of C#6 / D#6 differ by about 30 c in tune (row 1.9). Tuning: Story 1.6 listening, Story 5.5
# golden tests, Epic 7.
[cost]
dpad_change = 1  # DESIGN DEFAULT (not measured): D-pad state changes between two notes
stick_change = 2  # DESIGN DEFAULT (not measured): stick state changes between two notes
stick_through_centre = 1  # DESIGN DEFAULT (not measured): extra when the stick passes through centre (up <-> down)
same_button_retrigger = 1  # DESIGN DEFAULT (not measured): extra when the same button is re-pressed (needs min_gap_same_button_frames)
non_natural = 0.1  # DESIGN DEFAULT (not measured): tie breaker against a fingering with chart = false

# Fingerings: all 45 button x modifier combinations (5 buttons x D-pad none/up/down x stick none/up/down),
# MEASURED in free play with the stick at full travel and lx centred, one press each, pitch from the
# microphone (test plan row 1.9; docs/ocarina-input-mechanics.md, "Alternative fingerings (all 45
# combinations)"). Transcribed from that table, not derived. All 45 sound the model pitch
# (button + D-pad offset + stick offset) by nearest note. chart = true marks the 19 chart fingerings
# ("Fingering chart", measured with a tuner in row 1.2 and again with the microphone in row 1.9).
# The Hz in each header comment is the measured median from the 45-combination table.

[[fingerings]]  # B4, measured 499.9 Hz (chart)
button = "L"
dpad = "down"
stick = "down"
